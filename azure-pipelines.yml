trigger:
  branches:
    include:
      - main

pool:
  name: 'MyLocalPool'

variables:
  NODE_VERSION: '18.x'

stages:

# ─────────────────────────────────────
# STAGE 1 — BUILD
# ─────────────────────────────────────
- stage: Build
  displayName: '🔨 Build React App'
  jobs:
    - job: BuildJob
      displayName: 'Install & Build'
      pool:
        name: 'MyLocalPool'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: $(NODE_VERSION)
          displayName: '⚙ Setup Node.js'

        - script: npm ci
          displayName: '📦 Install Dependencies'

        - script: npm run build
          displayName: '🏗 Build React App'
          env:
            CI: false

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: 'build'
            artifactName: 'react-build'
          displayName: '📤 Publish Artifact'

# ─────────────────────────────────────
# STAGE 2 — DEPLOY (No Docker needed!)
# ─────────────────────────────────────
- stage: Deploy
  displayName: '🚀 Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
    - deployment: DeployJob
      displayName: 'Deploy using Azure CLI'
      pool:
        name: 'MyLocalPool'
      environment: 'production'
      strategy:
        runOnce:
          deploy:
            steps:

              # ✅ Install Azure CLI on agent
              - task: AzureCLI@2
                inputs:
                  azureSubscription: 'MyAzureConnection'
                  scriptType: 'ps'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    # Install SWA CLI
                    npm install -g @azure/static-web-apps-cli

                    # Deploy using SWA CLI
                    swa deploy $(Pipeline.Workspace)/react-build `
                      --deployment-token $(AZURE_STATIC_WEB_APPS_TOKEN) `
                      --env production
                displayName: '☁ Deploy to Azure Static Web App'