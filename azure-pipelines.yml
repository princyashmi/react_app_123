trigger:
  branches:
    include:
      - develop

pool:
  vmImage: 'ubuntu-22.04'

variables:
  NODE_VERSION: '18.x'

stages:

# ─────────────────────────────────────────
# STAGE 1 — BUILD
# ─────────────────────────────────────────
- stage: Build
  displayName: '🔨 Build React App'
  jobs:
    - job: BuildJob
      displayName: 'Install & Build'
      pool:
        vmImage: 'ubuntu-22.04'
      steps:

        - task: NodeTool@0
          inputs:
            versionSpec: $(NODE_VERSION)
          displayName: '⚙ Use Node.js $(NODE_VERSION)'

        - script: npm ci
          displayName: '📦 Install Dependencies'

        - script: npm run build
          displayName: '🏗 Build React App'
          env:
            CI: false

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: 'build'
            artifactName: 'react-build'
          displayName: '📤 Publish Build Artifact'

# ─────────────────────────────────────────
# STAGE 2 — DEPLOY
# ─────────────────────────────────────────
- stage: Deploy
  displayName: '🚀 Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
    - job: DeployJob                        # ✅ Regular job, NOT deployment job
      displayName: 'Deploy to Azure Static Web App'
      pool:
        vmImage: 'ubuntu-22.04'
      steps:

        # ✅ Step 1 — Download artifact into working directory
        - task: DownloadBuildArtifacts@1
          inputs:
            buildType: 'current'
            downloadType: 'single'
            artifactName: 'react-build'
            downloadPath: '$(System.DefaultWorkingDirectory)'
          displayName: '📥 Download Build Artifact'

        # ✅ Step 2 — Confirm files exist (debug helper)
        - script: ls -la $(System.DefaultWorkingDirectory)/react-build
          displayName: '🔍 List Build Files'

        # ✅ Step 3 — Deploy using RELATIVE path (avoids Docker /working_dir issue)
        - task: AzureStaticWebApp@0
          inputs:
            app_location: 'react-build'     # ✅ Relative path — no /working_dir conflict
            output_location: ''
            skip_app_build: true
            azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_TOKEN)
          displayName: '☁ Deploy to Azure Static Web App'